name: Validate benchmark results
# Runs on every change under results/: validates each result file against results/schema.json (and the submission
# rules for new files), then checks that results/index.json + results/README.md were regenerated
# (`python scripts/build_results_index.py`).  See docs/SUBMITTING.md.
on:
  pull_request:
    paths: ["results/**", "scripts/validate_result.py", "scripts/build_results_index.py"]
  push:
    branches: [main, master]
    paths: ["results/**", "scripts/validate_result.py", "scripts/build_results_index.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --quiet jsonschema
      - name: Validate every result file against the schema
        run: python scripts/validate_result.py --all
      - name: Apply the submission rules to result files changed in this PR
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'results/*.json' | grep -v -e 'results/schema.json' -e 'results/index.json' || true)
          if [ -z "$changed" ]; then echo "no result files changed"; exit 0; fi
          echo "changed: $changed"
          python scripts/validate_result.py --submission $changed
      - name: Check that results/index.json and results/README.md are regenerated
        run: python scripts/build_results_index.py --check
