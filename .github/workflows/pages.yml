name: Deploy site (catalogue + 3D viewer)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify immutable MotionLab deployment configuration
        if: ${{ hashFiles('deploy/planned-references.json') != '' }}
        run: |
          python3 scripts/verify_planned_reference_deployment.py --config deploy/planned-references.json --index-out "$RUNNER_TEMP/planned-reference-index.json" --github-env "$GITHUB_ENV"
      - name: Build viewer
        working-directory: viewer
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Assemble site (viewer + verified dataset, Blender renders and reference motion)
        run: |
          mkdir -p site
          cp -r viewer/dist/* site/
          # Versioned release media are pinned by SHA-256; generated assets stay out of source commits.
          python3 scripts/site_assets.py restore --manifest deploy/site-assets.json --out site
          if [ -f deploy/planned-references.json ]; then
            python3 scripts/verify_planned_reference_deployment.py --config deploy/planned-references.json --index-file "$RUNNER_TEMP/planned-reference-index.json" --assets-manifest site/assets/manifest.json
            cp deploy/planned-references.json site/planned-reference-deployment.json
          fi
          # benchmark results (leaderboard index + the full result files) for the Results page and the catalogue badges
          mkdir -p site/results
          cp results/*.json results/README.md site/results/ 2>/dev/null || true
          cp deploy/site-assets.json site/deployment.json
          touch site/.nojekyll
          python3 -c 'from pathlib import Path; n=sum(p.stat().st_size for p in Path("site").rglob("*") if p.is_file()); print(f"Site payload: {n:,} bytes"); assert n < 950_000_000, "Site exceeds the publication size budget"'
          du -sh site
      - name: Check viewer against the published dataset
        working-directory: viewer
        run: |
          rsync -a ../site/assets/ ../assets/
          bun run typecheck
          bun test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
